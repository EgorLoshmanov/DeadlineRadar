[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-radar"
version = "1.0.0"
description = "Telegram deadline tracker for students and study groups"
requires-python = ">=3.11"
authors = [{name = "Лошманов Егор Дмитриевич"}]
dependencies = ["aiogram==3.31.0", "APScheduler==3.11.0"]

[tool.setuptools]
py-modules = ["main", "bot", "config", "db", "llm", "models", "notifications", "parser", "plans", "presentation", "publications", "services"]

[tool.ruff]
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
